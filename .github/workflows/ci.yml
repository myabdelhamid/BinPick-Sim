name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MUJOCO_GL: egl
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: System libs for headless rendering
        run: sudo apt-get update && sudo apt-get install -y libegl1 libosmesa6 libgl1
      - run: uv sync --frozen
      - run: uv run pytest -q
