name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MUJOCO_GL: egl
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: System libs for headless rendering
        run: sudo apt-get update && sudo apt-get install -y libegl1 libegl-mesa0 libgl1-mesa-dri libosmesa6 libgl1
      - run: uv sync --frozen
      - name: Tests
        shell: bash  # with pipefail
        run: uv run pytest -q -rf --tb=short 2>&1 | tee pytest.log
      - name: Name the failing tests
        if: failure()
        run: grep -E "^(FAILED|ERROR)" pytest.log | sed 's/^/::error::/' || true
