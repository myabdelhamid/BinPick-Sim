[project]
name = "binpick"
version = "0.1.0"
description = "Simulated suction bin-picking cell with a reproducible benchmark"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mujoco>=3.2",
    "mink>=0.0.5",
    "numpy>=1.26",
    "open3d>=0.18",
    "pyyaml>=6",
    "pillow>=10",
    "imageio>=2.34",
    "imageio-ffmpeg>=0.8.1",
    "scipy>=1.11",
]

[project.scripts]
binpick-scene = "binpick.cli:scene_main"
binpick-demo = "binpick.cli:demo_main"
binpick-run = "binpick.cli:run_main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/binpick"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:dash"
pythonpath = ["tests"]
markers = ["slow: long-running simulation tests"]
