# BinPick-Sim settings. SI units throughout (m, kg, s).
seed: 1000                      # dev seed; benchmark seeds 1-25 are reserved for benchmark runs

parts:
  n_boxes: 15
  n_cylinders: 5
  box_footprint: [0.045, 0.110]  # each footprint side
  box_height: [0.020, 0.070]
  cyl_diameter: [0.040, 0.080]
  cyl_length: [0.040, 0.110]
  mass_min: 0.05
  mass_max: 2.5
  materials:
    plastic:   {prob: 0.6, density: 1200, friction: 0.6, rgba: [0.20, 0.45, 0.85, 1.0]}
    aluminium: {prob: 0.3, density: 2700, friction: 0.5, rgba: [0.75, 0.76, 0.78, 1.0]}
    steel:     {prob: 0.1, density: 7850, friction: 0.5, rgba: [0.35, 0.35, 0.38, 1.0]}

cup:
  diameter: 0.044
  length: 0.020
  rated_hold_kg: 3.0
  tool_length: 0.200             # flange to cup base; 200 mm extension so links 5-7 clear the 200 mm deep bin walls

bin:
  inner: [0.400, 0.300, 0.200]
  wall: 0.010

tray:
  rows: 4
  cols: 5
  slot: 0.120
  wall_height: 0.008             # low slot dividers

cameras:
  width: 640
  height: 480
  bin_fovy: 36.0                 # bin rim fills ~90% of the frame width
  bin_height_above_rim: 0.55
  tray_fovy: 42.0                # whole tray plus parts overhanging edge slots stay in frame
  tray_height: 0.90              # above tray surface

shaker:
  amplitude: 0.015
  freq_hz: 3.0
  duration_s: 1.5

settle:
  lin_tol: 0.001
  ang_tol: 0.01
  drop_timeout_s: 3.0
  max_redrops: 5
  drop_height_above_rim: 0.05
  inset: 0.06

layout:
  robot_base_pos: [0.0, 0.0, 0.0]
  bin_center_xy: [0.55, 0.0]
  tray_center_xy: [0.0, 0.55]
  table_height: 0.0              # bin outer bottom / tray base z

sim:
  timestep: 0.002
  noslip_iterations: 5         # removes perpetual contact jitter of wedged parts (cylinders)
  part_solref_timeconst: 0.01  # stiffer part contacts: ~1 mm penetration under a 20-part pile
  part_condim: 6               # torsional + rolling friction so wedged cylinders stop rocking

motion:
  max_joint_vel: [2.175, 2.175, 2.175, 2.175, 2.61, 2.61, 2.61]  # rad/s, Panda datasheet limits
  max_joint_acc: 8.0             # rad/s^2, empty cup
  max_joint_acc_loaded: 3.0      # rad/s^2, carrying a part (keeps inertial peel/shear on the cup low)
  max_cart_vel: 0.8              # m/s, straight-line cup moves
  max_cart_acc: 2.5              # m/s^2, carrying a part (lines are along the cup axis: 2.5 kg * (g + 2.5) = 31 N, 79% of the 39 N seal)
  max_cart_acc_empty: 4.0        # m/s^2, empty cup
  cart_step: 0.01                # IK waypoint spacing on straight lines
  pregrasp_dist: 0.12            # stand-off along the face normal before approach
  approach_overtravel: 0.002     # go this far past the surface (cup margin absorbs it)
  lift_dist: 0.06                # first lift along the face normal
  clear_above_rim: 0.05          # transport height margin above rim + part height
  place_clearance: 0.005         # part's lowest point above tray surface at release
  retreat_dist: 0.10
  settle_after_move_s: 0.03      # hold at the end of each move (velocity feed-forward keeps lag small)

timing:                          # sim-time costs of non-motion phases (real cells pay these too)
  capture_s: 0.3
  plan_s: 0.2
  vacuum_build_s: 0.15
  release_s: 0.25
  verify_s: 0.2

suction:
  lip_points: 16
  gap_ok: 0.006                  # tilt across the lip that still seals fully (M2 value; no datasheet tilt data)
  gap_max: 0.012                 # tilt across the lip at which the seal is lost (~16 deg)
  travel: 0.0135                 # Piab B40 vertical movement: largest lip height spread
  curve_radius_min: 0.020        # Piab B40 minimum curve radius (40 mm cylinder)
  curve_limit_q: 0.75            # ASSUMPTION: seal left at that radius (sheet only says it still works there)
  contact_dist: 0.006            # lip must be within this of the surface
  margin: 0.0005                 # cup contact margin
  pull_force_n: 39.0             # Piab B40 pull at 60 kPa (8.77 lb at 17.72 -inHg); must match vacuum_kpa
  peel_lever_ratio: 0.5          # moment capacity = F_avail * lip_radius * ratio (edge lifts before full lever)
  shear_friction: 0.5            # sideways/pull force; B40 sheet gives 0.67 (26.3 N), kept lower
  bellows_timeconst: 0.006       # grip weld solref time constant; gravity sag ~ g*tc^2 = 0.35 mm
  break_filter_s: 0.02           # seal fails on load sustained ~20 ms (air must leak in), not on 2 ms spikes
  vacuum_kpa: 60.0
  sealed_threshold_kpa: 40.0     # grip confirmed below -40 kPa
  lost_threshold_kpa: 20.0       # hysteresis: grip lost only above -20 kPa ...
  lost_debounce_polls: 3         # ... on 3 consecutive 20 ms readings (one noisy sample is not a drop)
  sensor_noise_kpa: 1.0
